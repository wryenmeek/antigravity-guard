[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-guard"
version = "2.0.0"
description = "Global Antigravity guardrails: commit receipts, skill provenance, adversarial issue audits, PR token telemetry, and pre-merge gates"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Wryen Meek" }
]
keywords = ["antigravity", "telemetry", "guard", "ai-agents", "llm", "tokens", "github-actions", "merge-guard", "hooks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance"
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.10",
    "ty==0.0.29",
    "actionlint-py>=1.7.12",
]

[project.scripts]
antigravity-guard = "antigravity_guard.cli:main"
antigravity-telemetry = "antigravity_guard.cli:main"

[project.urls]
Homepage = "https://github.com/wryenmeek/antigravity-guard"
Repository = "https://github.com/wryenmeek/antigravity-guard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "S603", "S607"]
"src/**/*.py" = ["S603", "S607"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["antigravity_guard"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 90
