name: 'Antigravity Guard Pre-Merge Action'
description: 'Validates Antigravity session telemetry receipts, unresolved review threads, and optional skill/issue completion audits'
author: 'wryenmeek'

inputs:
  pr-number:
    description: 'Pull Request number to verify'
    required: true
  post-status:
    description: 'Post GitHub Commit Status check to headRefOid upon completion'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token with contents:read, pull-requests:read, statuses:write'
    required: false
    default: ${{ github.token }}
  repo:
    description: 'Optional owner/repo if checking across repositories'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install antigravity-guard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 -m pip install --no-cache-dir "$ACTION_PATH"

    - name: Execute Antigravity Guard
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_POST_STATUS: ${{ inputs.post-status }}
      run: |
        ARGS=(--pr "$INPUT_PR_NUMBER")
        if [ -n "$INPUT_REPO" ]; then
          ARGS+=(--repo "$INPUT_REPO")
        fi
        if [ "$INPUT_POST_STATUS" = "true" ]; then
          ARGS+=(--post-status)
        fi
        antigravity-guard verify "${ARGS[@]}"
