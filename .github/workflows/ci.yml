name: Antigravity Guard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Type Check & Plugin Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and set up Python 3.11
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.11"
          enable-cache: ${{ !env.ACT }}

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run Ruff lint and format checks
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Run ty static type check
        run: uv run --locked ty check

      - name: Run actionlint workflow validation
        run: uv run --locked actionlint

      - name: Validate plugin bundle metadata
        run: uv run --locked antigravity-guard validate-plugin --strict

  test-matrix:
    name: Tests & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !env.ACT }}

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run unit & integration tests with coverage threshold
        run: uv run --locked pytest -q --cov=antigravity_guard --cov-fail-under=90

  package-and-action-smoke:
    name: Build Wheel & CLI Alias Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and set up Python 3.12
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
          enable-cache: ${{ !env.ACT }}

      - name: Build distribution artifacts
        run: uv build --wheel --sdist

      - name: Install built wheel into clean venv & verify CLIs
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --no-cache-dir dist/*.whl
          /tmp/smoke-venv/bin/antigravity-guard version
          /tmp/smoke-venv/bin/antigravity-telemetry version
          /tmp/smoke-venv/bin/antigravity-guard validate-plugin --repo-root . --strict

  ci-gate:
    name: CI Gate
    needs: [lint-and-typecheck, test-matrix, package-and-action-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required CI jobs passed
        env:
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          TEST_RESULT: ${{ needs.test-matrix.result }}
          PKG_RESULT: ${{ needs.package-and-action-smoke.result }}
        run: |
          if [ "$LINT_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] || [ "$PKG_RESULT" != "success" ]; then
            echo "CI Gate failed: lint=$LINT_RESULT test=$TEST_RESULT pkg=$PKG_RESULT" >&2
            exit 1
          fi
          echo "All CI Gate jobs passed."
