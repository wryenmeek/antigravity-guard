repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Run Ruff linter
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-format
        name: Run Ruff formatter check
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ty-check
        name: Run ty static type checker
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: actionlint
        name: Validate GitHub Actions workflows
        entry: uv run --locked actionlint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pytest
        name: Run unit and integration test suite
        entry: uv run --locked pytest -q --cov=antigravity_guard --cov-fail-under=90
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
